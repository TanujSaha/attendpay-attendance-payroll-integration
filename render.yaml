services:
  - type: web
    name: attendpay-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/attendpay.db
      - key: PYTHON_VERSION
        value: 3.13.0
    disk:
      name: attendpay-data
      mountPath: /var/data
      sizeGB: 1
